<!DOCTYPE html><html lang="vi"><head>
    <script async="" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4981774130252490" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Tiệm Truyện Chữ</title>
    <link rel="icon" href="/uploads/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/pages/login.css">

</head>
<body>
    <div class="card shadow">
        <div class="card-header">
            <h4 class="mb-0 fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP</h4>
            <small>Chào mừng bạn trở lại với Tiệm Truyện</small>
        </div>
        <div class="card-body p-4">
            <form action="/login" method="POST"> 
                <input type="hidden" name="redirect" value="/">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Tên đăng nhập</label> 
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                        <input name="username" class="form-control" placeholder="Nhập tài khoản" required=""> 
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span> 
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required="">
                    </div>
                </div> 
                <button type="submit" class="btn btn-danger w-100 mb-3" id="btn-login-page">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="login-page-spinner"></span>
                    ĐĂNG NHẬP NGAY
                </button>
            </form>


            <div class="text-center my-2">
                <span class="text-muted small px-2" style="position:relative;display:block;">
                    <span style="background:#fff;padding:0 12px;position:relative;z-index:1;">hoặc</span>
                    <hr style="position:absolute;top:50%;left:0;right:0;margin:0;border-color:#dee2e6;">
                </span>
            </div>
            <button type="button" id="btn-google-login" onclick="startGoogleLogin()" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid #dadce0;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;color:#3c4043;cursor:pointer;transition:box-shadow .15s,background .15s;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.15)';this.style.background='#f8f9fa'" onmouseout="this.style.boxShadow='0 1px 3px rgba(0,0,0,.08)';this.style.background='#fff'">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.93 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></svg>
                Đăng nhập với Google
            </button>

            <div class="text-center">
                <a href="javascript:void(0)" class="text-decoration-none text-danger fw-bold small" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                    <i class="fa-solid fa-key me-1"></i> Quên mật khẩu? 
                </a>
                <hr>
                <p class="text-muted small">Chưa có tài khoản? 
                <a href="/register" class="text-danger fw-bold text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header border-0 bg-light">
                    <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-shield-halved me-2"></i>Khôi phục mật khẩu</h5> 
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="step-email">
                        <p class="text-muted small mb-3">Vui lòng nhập Tên tài khoản và Email đăng ký để nhận mã OTP.</p> 
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên tài khoản</label>
                            <input type="text" id="forgot-username" class="form-control" placeholder="Nhập tên tài khoản">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email đăng ký</label>
                            <div class="input-group">
                                <input type="email" id="forgot-email" class="form-control" placeholder="Email của bạn"> 
                                <button class="btn btn-danger" type="button" id="btn-send-otp">Nhận OTP</button>
                            </div>
                        </div>
                    </div>

                    <div id="step-otp" style="display: none;">
                        <p class="text-success small mb-3"><i class="fa-solid fa-circle-check me-1"></i>Mã OTP đã được gửi! Kiểm tra hộp thư.</p> 
                        <div class="mb-3">
                            <input type="text" id="otp-code" class="form-control text-center fw-bold fs-4" placeholder="Nhập 6 số OTP" maxlength="6">
                        </div> 
                        <button class="btn btn-danger w-100 mb-3" type="button" id="btn-verify-otp">Xác nhận mã OTP</button> 
                        
                        <div class="text-center">
                            <small class="text-muted">Không nhận được mã? 
                                <a href="javascript:void(0)" id="btn-resend-otp" class="text-danger text-decoration-none fw-bold">Gửi lại ngay</a>
                                <span id="resend-timer" class="text-secondary" style="display: none;">(60s)</span>
                            </small>
                        </div> 
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body></html>
